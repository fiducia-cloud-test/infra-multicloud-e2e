name: DEN-845 namespace manifest refresh candidate

on:
  pull_request:
    paths:
      - '.github/workflows/den-845-namespace-baseline-classification.yml'
      - 'docs/den-845-namespace-baseline-classification.md'
      - 'scripts/k8s-namespace-baseline-classification.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-845-namespace-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K8S_BASE_SHA: 18f1fa1dc8360c4817e1adbc1351b93f7d8604de
  K8S_HEAD_SHA: 664ea2fa106168e7e62ab70adb5719d54f59e9c4

jobs:
  generate:
    name: Exact-head deterministic manifest refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out independent test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact Kubernetes repair head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: 664ea2fa106168e7e62ab70adb5719d54f59e9c4
          path: _src/k8s-cluster
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Verify exact source identities and harness syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _src/k8s-cluster rev-parse HEAD)" = "${K8S_HEAD_SHA}"
          git -C _src/k8s-cluster cat-file -e "${K8S_BASE_SHA}^{commit}"
          python3 -m py_compile scripts/k8s-namespace-baseline-classification.py

      - name: Reproduce production gate and render validated replacement
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/den-845-namespace-manifest-refresh.json
          CANDIDATE_PATH: ${{ runner.temp }}/migration-manifest.head-664ea2f.json
        run: >-
          python3 scripts/k8s-namespace-baseline-classification.py
          --source _src/k8s-cluster
          --base "${K8S_BASE_SHA}"
          --head "${K8S_HEAD_SHA}"
          --evidence "${EVIDENCE_PATH}"
          --candidate "${CANDIDATE_PATH}"

      - name: Parse generated outputs
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/den-845-namespace-manifest-refresh.json
          CANDIDATE_PATH: ${{ runner.temp }}/migration-manifest.head-664ea2f.json
        run: |
          set -euo pipefail
          python3 -m json.tool "${EVIDENCE_PATH}" >/dev/null
          python3 -m json.tool "${CANDIDATE_PATH}" >/dev/null

      - name: Upload metadata-only evidence and validated candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-845-namespace-manifest-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/den-845-namespace-manifest-refresh.json
            ${{ runner.temp }}/migration-manifest.head-664ea2f.json
          if-no-files-found: warn
          retention-days: 14
