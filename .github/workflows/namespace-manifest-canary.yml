# Independent exact-head validation for the DEN-2949 plaintext manifest.
name: namespace plaintext manifest canary

on:
  pull_request:
    paths:
      - '.github/workflows/namespace-manifest-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-manifest-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: exact-head plaintext manifest from fiducia-cloud-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUBJECT_SHA: bb11a68ba6f2667bdea655c88b155a6ca3c910e0
      EXPECTED_INVENTORY_SHA256: c9223c5eee842e50d67a393fc275ad50968dcd5e828d6daefb6560ae389e02e0
      EXPECTED_MANIFEST_SHA256: 6ef5ad2e8c9c63870adac9dd283f2de9a3e74006875a5e81bcfa425083c4d35f
    steps:
      - name: Check out canary without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out exact public k8s-cluster manifest head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Assert exact source and absence of staging transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
          test ! -e subject/.github/transport/den-2786-manifest-source.tar.xz
          test ! -e subject/.github/workflows/den-2786-materialize-manifest.yml
          test -z "$(find subject/catalog/namespaces -maxdepth 1 -type f -name '.den-2786-bundle-*.hex' -print -quit)"

      - name: Compile namespace source and tests
        run: |
          python3 -m py_compile \
            subject/tools/namespace_migration.py \
            subject/tools/test_namespace_migration.py \
            subject/tools/namespace_test_owner_contract.py \
            subject/tools/test_namespace_test_owner_contract.py \
            subject/tools/namespace_manifest.py \
            subject/tools/test_namespace_manifest.py

      - name: Run source adversarial suites
        run: |
          python3 subject/tools/test_namespace_migration.py
          python3 subject/tools/test_namespace_test_owner_contract.py
          python3 subject/tools/test_namespace_manifest.py

      - name: Reproduce inventory and validate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 subject/tools/namespace_migration.py inventory \
            --root subject \
            --format json \
            > artifacts/namespace-inventory.json
          python3 subject/tools/namespace_manifest.py check \
            --root subject \
            --format json \
            > artifacts/namespace-manifest-report.json
          sha256sum \
            subject/catalog/namespaces/migration-manifest.json \
            subject/catalog/namespaces/migration-manifest.schema.json \
            artifacts/namespace-inventory.json \
            > artifacts/namespace-manifest-canary.sha256

      - name: Verify exact identities, digests, and fail-closed controls
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          subject = Path('subject')
          artifacts = Path('artifacts')
          subject_sha = os.environ['SUBJECT_SHA']
          expected_inventory_sha = os.environ['EXPECTED_INVENTORY_SHA256']
          expected_manifest_sha = os.environ['EXPECTED_MANIFEST_SHA256']

          inventory_path = artifacts / 'namespace-inventory.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          committed_inventory = json.loads(
              (subject / 'artifacts/namespace-inventory.json').read_text(
                  encoding='utf-8'
              )
          )
          report = json.loads(
              (artifacts / 'namespace-manifest-report.json').read_text(
                  encoding='utf-8'
              )
          )
          manifest_path = subject / 'catalog/namespaces/migration-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          schema = json.loads(
              (
                  subject
                  / 'catalog/namespaces/migration-manifest.schema.json'
              ).read_text(encoding='utf-8')
          )

          entries = manifest['spec']['entries']
          occurrences = inventory['occurrences']
          entry_count = len(entries)
          inventory_count = len(occurrences)
          inventory_sha = hashlib.sha256(inventory_path.read_bytes()).hexdigest()
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()

          inventory_identity = {
              (
                  item['path'], item['line'], item['column'],
                  item['system'], item['reference'],
              )
              for item in occurrences
          }
          manifest_identity = {
              (
                  item['path'], item['line'], item['column'],
                  item['system'], item['current'],
              )
              for item in entries
          }
          checks = {
              'exact inventory reproduction': inventory == committed_inventory,
              'inventory summary total matches occurrences': inventory['summary']['total'] == inventory_count,
              'manifest report valid': report.get('valid') is True,
              'manifest report entries match manifest': report.get('entryCount') == entry_count,
              'inventory report entries match inventory': report.get('inventoryEntryCount') == inventory_count,
              'inventory and manifest counts match': entry_count == inventory_count,
              'one row per identity': inventory_identity == manifest_identity,
              'no duplicate manifest identities': len(manifest_identity) == entry_count,
              'inventory digest matches certified main evidence': inventory_sha == expected_inventory_sha,
              'report inventory digest matches certified main evidence': report.get('inventorySha256') == expected_inventory_sha,
              'manifest digest matches certified main evidence': manifest_sha == expected_manifest_sha,
              'report manifest digest matches certified main evidence': report.get('manifestSha256') == expected_manifest_sha,
              'execution disabled': manifest['spec']['executionAuthorized'] is False,
              'cleanup disabled': all(
                  item.get('destructiveCleanupAllowed') is False
                  for item in entries
              ),
              'no diagnostics': report.get('diagnostics') == [],
              'no encoded staging': report.get('encodedStagingFiles') == [],
              'strict schema': schema.get('additionalProperties') is False,
          }
          failed = [name for name, valid in checks.items() if not valid]
          if failed:
              raise SystemExit('plaintext manifest canary failed: ' + ', '.join(failed))

          evidence = {
              'valid': True,
              'subjectSha': subject_sha,
              'entryCount': entry_count,
              'inventorySummary': inventory['summary'],
              'inventorySha256': inventory_sha,
              'manifestSha256': manifest_sha,
              'checks': checks,
              'credentialsLoaded': [],
              'providerWrites': [],
          }
          (artifacts / 'namespace-manifest-canary.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload independent manifest evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-plaintext-manifest-canary
          path: |
            artifacts/namespace-manifest-canary.json
            artifacts/namespace-manifest-report.json
            artifacts/namespace-inventory.json
            artifacts/namespace-manifest-canary.sha256
          if-no-files-found: error
          retention-days: 14
