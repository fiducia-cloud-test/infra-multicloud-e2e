# Additive cross-organization fixture; it does not modify the generated harness.
name: namespace ownership canary

on:
  pull_request:
    paths:
      - '.github/workflows/namespace-ownership-canary.yml'
      - 'scripts/namespace-ownership-canary.py'
      - 'scripts/namespace-scanner-boundary-audit.py'
      - 'patches/den-2926-scanner-boundaries.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-ownership-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: exact-head contract from fiducia-cloud-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out canary without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out exact pre-fix k8s-cluster subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: fe434f4cb752c14b3f7db2d03031d57c299e2dad
          path: subject-before
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Check out exact refined k8s-cluster subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: f3cf41015c9b99a0de31d1056224c8eea2e1bbb6
          path: subject
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Compile source and canary validators
        run: |
          python3 -m py_compile \
            subject/tools/namespace_migration.py \
            subject/tools/test_namespace_migration.py \
            subject/tools/namespace_test_owner_contract.py \
            subject/tools/test_namespace_test_owner_contract.py \
            scripts/namespace-ownership-canary.py \
            scripts/namespace-scanner-boundary-audit.py

      - name: Run refined source namespace tests
        run: |
          python3 subject/tools/test_namespace_migration.py
          python3 subject/tools/test_namespace_test_owner_contract.py

      - name: Run independent test-org ownership canary
        run: |
          mkdir -p artifacts
          python3 scripts/namespace-ownership-canary.py \
            --subject subject \
            --format json \
            > artifacts/namespace-ownership-canary.json

      - name: Confirm the pre-fix exact head fails token boundaries
        id: before_boundary
        continue-on-error: true
        run: |
          python3 scripts/namespace-scanner-boundary-audit.py \
            --subject subject-before \
            --format json \
            > artifacts/namespace-scanner-boundary-before.json

      - name: Require refined token and template boundaries
        run: |
          python3 scripts/namespace-scanner-boundary-audit.py \
            --subject subject \
            --format json \
            > artifacts/namespace-scanner-boundary-fixed.json

      - name: Verify the independently reviewed patch is present
        run: |
          git -C subject apply --reverse --check ../patches/den-2926-scanner-boundaries.patch
          git -C subject diff --check

      - name: Run the refined source contract
        run: |
          python3 subject/tools/namespace_migration.py check \
            --root subject \
            --format json \
            > artifacts/namespace-contract-fixed.json

      - name: Generate exact before and refined inventories
        run: |
          python3 subject-before/tools/namespace_migration.py inventory \
            --root subject-before \
            --format json \
            > artifacts/namespace-inventory-before.json
          python3 subject/tools/namespace_migration.py inventory \
            --root subject \
            --format json \
            > artifacts/namespace-inventory-fixed.json

      - name: Verify committed inventory and delta are reproducible
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifacts = Path('artifacts')
          generated = json.loads((artifacts / 'namespace-inventory-fixed.json').read_text())
          committed = json.loads(Path('subject/artifacts/namespace-inventory.json').read_text())
          delta = json.loads(Path('subject/artifacts/den-2926-inventory-delta.json').read_text())
          before = json.loads((artifacts / 'namespace-inventory-before.json').read_text())

          if generated != committed:
              raise SystemExit('committed refined inventory is not exact-head reproducible')
          if generated.get('generatedFrom', {}).get('root') != '.':
              raise SystemExit('refined inventory contains environment-specific root provenance')
          if any(item['path'].startswith('artifacts/') for item in generated['occurrences']):
              raise SystemExit('refined inventory recursively scanned committed evidence')

          def identity(item):
              return (
                  item['path'], item['line'], item['column'],
                  item['system'], item['reference'],
              )

          before_items = {identity(item): item for item in before['occurrences']}
          fixed_items = {identity(item): item for item in generated['occurrences']}
          removed = before_items.keys() - fixed_items.keys()
          added = fixed_items.keys() - before_items.keys()

          expected_after = {
              'total': 1134,
              'distinctReferences': 220,
              'unclassifiedActive': 483,
              'bySystem': {
                  'generated-package': 82,
                  'host-path': 191,
                  'metadata-key': 367,
                  'slash-namespace': 380,
                  'source-package': 114,
              },
              'byOwner': {
                  'benefactor-cc': 3,
                  'fiducia-cloud': 67,
                  'ores': 458,
                  'shared-auth': 11,
                  'unclassified': 595,
              },
          }
          summary = generated['summary']
          for key in ('total', 'distinctReferences', 'unclassifiedActive'):
              if summary[key] != expected_after[key]:
                  raise SystemExit(f'unexpected refined {key}: {summary[key]}')
          if summary['bySystem'] != expected_after['bySystem']:
              raise SystemExit('unexpected refined bySystem counts')
          if summary['byOwner'] != expected_after['byOwner']:
              raise SystemExit('unexpected refined byOwner counts')
          if len(removed) != 405 or len(added) != 0:
              raise SystemExit('unexpected exact occurrence delta')
          if delta['after'] != summary:
              raise SystemExit('committed delta after-summary does not match inventory')
          if delta['before'] != before['summary']:
              raise SystemExit('committed delta before-summary does not match baseline')
          if delta['removedOccurrenceCount'] != 405 or delta['addedOccurrenceCount'] != 0:
              raise SystemExit('committed delta occurrence counts are stale')
          if delta['sourcePatch']['commit'] != '46c3b9d08330e26aee03a98b682adca5b44d94ea':
              raise SystemExit('committed delta does not identify the refined test-org patch')
          if delta['sourcePatch']['gitBlob'] != 'f3e0ee581df64c78eae46d8f903361ef9f5d03f8':
              raise SystemExit('committed delta has the wrong refined patch blob')
          if delta['sourcePatch']['sha256'] != 'cdc9799efb1e5ed9656b5aee5f19aad47a486448fa18df1115ca5918673a2af2':
              raise SystemExit('committed delta has the wrong refined patch digest')
          PY

      - name: Quantify exact refined inventory deltas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifacts = Path('artifacts')
          before = json.loads((artifacts / 'namespace-inventory-before.json').read_text())
          fixed = json.loads((artifacts / 'namespace-inventory-fixed.json').read_text())
          fixed_boundary = json.loads(
              (artifacts / 'namespace-scanner-boundary-fixed.json').read_text()
          )
          fixed_contract = json.loads(
              (artifacts / 'namespace-contract-fixed.json').read_text()
          )

          def identity(item):
              return (
                  item['path'], item['line'], item['column'],
                  item['system'], item['reference'],
              )

          before_items = {identity(item): item for item in before['occurrences']}
          fixed_items = {identity(item): item for item in fixed['occurrences']}
          removed = [before_items[key] for key in sorted(before_items.keys() - fixed_items.keys())]
          added = [fixed_items[key] for key in sorted(fixed_items.keys() - before_items.keys())]
          before_summary = before['summary']
          fixed_summary = fixed['summary']
          systems = sorted(
              set(before_summary.get('bySystem', {}))
              | set(fixed_summary.get('bySystem', {}))
          )
          report = {
              'valid': (
                  before.get('valid')
                  and fixed.get('valid')
                  and fixed_boundary.get('valid')
                  and fixed_contract.get('valid')
                  and fixed_summary['total'] == 1134
                  and len(removed) == 405
                  and not added
              ),
              'beforeSha': 'fe434f4cb752c14b3f7db2d03031d57c299e2dad',
              'fixedSha': 'f3cf41015c9b99a0de31d1056224c8eea2e1bbb6',
              'patchCommit': '46c3b9d08330e26aee03a98b682adca5b44d94ea',
              'patchBlob': 'f3e0ee581df64c78eae46d8f903361ef9f5d03f8',
              'patchSha256': 'cdc9799efb1e5ed9656b5aee5f19aad47a486448fa18df1115ca5918673a2af2',
              'before': before_summary,
              'fixed': fixed_summary,
              'delta': {
                  'total': fixed_summary['total'] - before_summary['total'],
                  'distinctReferences': (
                      fixed_summary['distinctReferences']
                      - before_summary['distinctReferences']
                  ),
                  'unclassifiedActive': (
                      fixed_summary['unclassifiedActive']
                      - before_summary['unclassifiedActive']
                  ),
                  'bySystem': {
                      name: (
                          fixed_summary.get('bySystem', {}).get(name, 0)
                          - before_summary.get('bySystem', {}).get(name, 0)
                      )
                      for name in systems
                  },
              },
              'removedOccurrenceCount': len(removed),
              'addedOccurrenceCount': len(added),
              'removedSamples': removed[:50],
              'addedSamples': added[:50],
              'fixedBoundary': fixed_boundary,
              'fixedContractDiagnostics': fixed_contract.get('diagnostics', []),
          }
          (artifacts / 'namespace-inventory-delta.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          if not report['valid']:
              raise SystemExit('refined exact-head inventory proof is not valid')
          print(json.dumps(report['delta'], indent=2, sort_keys=True))
          PY

      - name: Stage exact refined-head review snapshot
        run: |
          mkdir -p artifacts/source-snapshot/tools artifacts/source-snapshot/artifacts
          cp subject/tools/namespace_migration.py artifacts/source-snapshot/tools/
          cp subject/tools/test_namespace_migration.py artifacts/source-snapshot/tools/
          cp subject/artifacts/namespace-inventory.json artifacts/source-snapshot/artifacts/
          cp subject/artifacts/den-2926-inventory-delta.json artifacts/source-snapshot/artifacts/
          printf '%s\n' 'f3cf41015c9b99a0de31d1056224c8eea2e1bbb6' > artifacts/source-snapshot/SUBJECT_SHA

      - name: Upload canary and exact-head evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-ownership-canary
          path: |
            artifacts/namespace-ownership-canary.json
            artifacts/namespace-scanner-boundary-before.json
            artifacts/namespace-scanner-boundary-fixed.json
            artifacts/namespace-contract-fixed.json
            artifacts/namespace-inventory-before.json
            artifacts/namespace-inventory-fixed.json
            artifacts/namespace-inventory-delta.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact refined source snapshot for independent review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-source-snapshot
          path: artifacts/source-snapshot
          if-no-files-found: error
          retention-days: 3

      - name: Enforce that the known pre-fix exact head remains a negative control
        if: ${{ steps.before_boundary.outcome != 'failure' }}
        run: |
          echo 'The pre-fix exact head unexpectedly passed the boundary audit.' >&2
          exit 1
