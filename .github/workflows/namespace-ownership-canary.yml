# Additive cross-organization fixture; it does not modify the generated harness.
name: namespace ownership canary

on:
  pull_request:
    paths:
      - '.github/workflows/namespace-ownership-canary.yml'
      - 'scripts/namespace-ownership-canary.py'
      - 'scripts/namespace-scanner-boundary-audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-ownership-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: exact-head contract from fiducia-cloud-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out canary without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out exact public k8s-cluster subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: fe434f4cb752c14b3f7db2d03031d57c299e2dad
          path: subject
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Compile source and canary validators
        run: |
          python3 -m py_compile \
            subject/tools/namespace_migration.py \
            subject/tools/test_namespace_migration.py \
            subject/tools/namespace_test_owner_contract.py \
            subject/tools/test_namespace_test_owner_contract.py \
            scripts/namespace-ownership-canary.py \
            scripts/namespace-scanner-boundary-audit.py

      - name: Run source namespace tests
        run: |
          python3 subject/tools/test_namespace_migration.py
          python3 subject/tools/test_namespace_test_owner_contract.py

      - name: Run independent test-org canary
        run: |
          mkdir -p artifacts
          python3 scripts/namespace-ownership-canary.py \
            --subject subject \
            --format json \
            > artifacts/namespace-ownership-canary.json

      - name: Audit scanner token boundaries
        id: boundary
        continue-on-error: true
        run: |
          python3 scripts/namespace-scanner-boundary-audit.py \
            --subject subject \
            --format json \
            > artifacts/namespace-scanner-boundary-audit.json

      - name: Stage review snapshot
        run: |
          mkdir -p artifacts/source-snapshot/tools artifacts/source-snapshot/catalog/namespaces
          cp subject/tools/namespace_migration.py artifacts/source-snapshot/tools/
          cp subject/tools/test_namespace_migration.py artifacts/source-snapshot/tools/
          cp subject/catalog/namespaces/owners.json artifacts/source-snapshot/catalog/namespaces/
          cp subject/catalog/namespaces/migration-rules.json artifacts/source-snapshot/catalog/namespaces/
          cp subject/catalog/namespaces/owner-registry.schema.json artifacts/source-snapshot/catalog/namespaces/
          cp subject/catalog/namespaces/migration-rules.schema.json artifacts/source-snapshot/catalog/namespaces/
          if compgen -G 'subject/catalog/namespaces/.den-2786-bundle-*.hex' > /dev/null; then
            cp subject/catalog/namespaces/.den-2786-bundle-*.hex artifacts/source-snapshot/catalog/namespaces/
          fi
          printf '%s\n' 'fe434f4cb752c14b3f7db2d03031d57c299e2dad' > artifacts/source-snapshot/SUBJECT_SHA

      - name: Upload canary and boundary evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-ownership-canary
          path: |
            artifacts/namespace-ownership-canary.json
            artifacts/namespace-scanner-boundary-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact source snapshot for independent review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: namespace-source-snapshot
          path: artifacts/source-snapshot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Enforce scanner token boundaries
        if: ${{ steps.boundary.outcome == 'failure' }}
        run: |
          echo 'The subject scanner truncated one or more longer tokens; inspect the uploaded boundary audit.' >&2
          exit 1
